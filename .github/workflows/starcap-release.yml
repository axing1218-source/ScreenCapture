name: StarCap Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one release publisher may run at a time. A later run waits for the
# current publisher, then re-checks whether that version already exists.
concurrency:
  group: starcap-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4

      - name: Resolve StarCap version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content 'Src\Version.h' -Raw
          $match = [regex]::Match($text, 'STARCAP_DISPLAY_VERSION\s+L"v([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Unable to resolve STARCAP_DISPLAY_VERSION.' }
          $version = $match.Groups[1].Value

          $json = Get-Content 'Doc\version.json' -Raw | ConvertFrom-Json
          $jsonVersion = ($json.version -join '.')
          if ($jsonVersion -ne $version) {
            throw "Version mismatch: Version.h=$version, Doc/version.json=$jsonVersion"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release candidate: StarCap v$version"

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$tag already exists; release build is not needed."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$tag does not exist; building a release."
            $global:LASTEXITCODE = 0
          }

      - name: Setup MSBuild
        if: steps.existing.outputs.exists != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'

          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $actualLingCommit = (git -C D:\project\Ling rev-parse HEAD).Trim()
          if ($actualLingCommit -ne $lingCommit) {
            throw "Ling checkout mismatch: expected $lingCommit, got $actualLingCommit"
          }

          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8

          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          if (-not $lingApp.Contains($oldTrayLine)) { throw 'Ling tray icon load line changed.' }
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
          Set-Content $lingAppPath $lingApp -Encoding utf8

      - name: Build Yoga and Ling
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare and verify release assets
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $exe = 'x64\Release\StarCap.exe'
          if (-not (Test-Path $exe)) { throw 'StarCap.exe was not produced.' }

          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe 'release\StarCap.exe' -Force
          Copy-Item 'Doc\version.json' 'release\version.json' -Force

          @'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          required = [
              'StarCap.exe',
              'https://github.com/axing1218-source/StarCap/releases/latest/download/version.json',
              'https://github.com/axing1218-source/StarCap/releases/latest/download/StarCap.exe',
              'StarCap.update.exe'
          ]
          forbidden = [
              'https://github.com/xland/ScreenCapture/releases',
              'screen-capture-1300696206.cos.ap-chengdu.myqcloud.com',
              'ScreenCapture.update.exe'
          ]
          missing = [s for s in required if s.encode('utf-8') not in data and s.encode('utf-16le') not in data]
          hits = [s for s in forbidden if s.encode('utf-8') in data or s.encode('utf-16le') in data]
          if missing:
              raise SystemExit('Release binary is missing required StarCap update-channel strings: ' + ', '.join(missing))
          if hits:
              raise SystemExit('Release binary still contains upstream update-channel strings: ' + ', '.join(hits))
          print('Release binary verification passed.')
          '@ | Set-Content verify_release.py -Encoding utf8
          python verify_release.py 'release\StarCap.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash 'release\StarCap.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  StarCap.exe" | Set-Content 'release\SHA256SUMS.txt' -Encoding ascii
          Write-Host "StarCap.exe SHA256: $hash"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'

          # A previous serialized run may have published this version while this
          # run was waiting/building. Treat that as success, not a failed release.
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag was already published by another run; nothing to do."
            exit 0
          }
          $global:LASTEXITCODE = 0

          gh release create $tag `
            'release\StarCap.exe' `
            'release\version.json' `
            'release\SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "StarCap v$version" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
