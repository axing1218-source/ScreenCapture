name: Apply Magnifier Center Frame Fix

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/apply-magnifier-center-frame-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Align center frame to blue intersection
        shell: python
        run: |
          from pathlib import Path
          path = Path('Src/Win/CutMask.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    const auto centerCell = D2D1::RectF(cx, cy, cx + cellW, cy + cellH);\n    ctx->DrawRectangle(centerCell, brushCenterBorder.Get(), std::max(.9f, 1.35f * scale));\n    ctx->SetAntialiasMode(oldAA);\n'''
          new = '''    // The black frame must coincide exactly with the blue square formed by the\n    // cross intersection. Build the frame from four filled bars instead of\n    // DrawRectangle so every side has the exact same thickness and no side\n    // receives different stroke rasterization.\n    const float outlineThickness = std::max(.9f, 1.35f * scale);\n    const float squareL = cellCenterX - crossHalf;\n    const float squareT = cellCenterY - crossHalf;\n    const float squareR = cellCenterX + crossHalf;\n    const float squareB = cellCenterY + crossHalf;\n    ctx->FillRectangle(D2D1::RectF(squareL, squareT, squareR, squareT + outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareL, squareB - outlineThickness, squareR, squareB), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareL, squareT + outlineThickness, squareL + outlineThickness, squareB - outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareR - outlineThickness, squareT + outlineThickness, squareR, squareB - outlineThickness), brushCenterBorder.Get());\n    ctx->SetAntialiasMode(oldAA);\n'''
          if old not in text:
              raise SystemExit('Target center-cell drawing block not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Align magnifier center frame"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build updated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/apply-magnifier-center-frame-fix.yml
          git commit -m "Remove temporary magnifier frame patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
