name: One-shot OCR overlay patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-overlay-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unify OCR translated image background
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Src/StarCapOcrV2.h')
          text = path.read_text(encoding='utf-8-sig')
          old = (
              "                auto bgColor = sampleBackground(it.block);\n"
              "                const float lum = bgColor.r * .299f + bgColor.g * .587f + bgColor.b * .114f;\n"
              "                auto textColor = lum > .55f ? D2D1::ColorF(D2D1::ColorF::Black) : D2D1::ColorF(D2D1::ColorF::White);\n"
              "                Microsoft::WRL::ComPtr<ID2D1SolidColorBrush> bgBrush, textBrush;\n"
              "                ctx->CreateSolidColorBrush(bgColor, bgBrush.GetAddressOf());\n"
              "                ctx->CreateSolidColorBrush(textColor, textBrush.GetAddressOf());\n"
              "                if (!bgBrush || !textBrush) continue;\n"
              "                ctx->FillRectangle(it.slot, bgBrush.Get());\n"
          )
          new = (
              "                // Keep translated screenshot content visually consistent in both app themes.\n"
              "                // The translation layer is image content, not UI: use the same uniform white\n"
              "                // surface as direct screenshot translation and always render black text on it.\n"
              "                Microsoft::WRL::ComPtr<ID2D1SolidColorBrush> bgBrush, textBrush;\n"
              "                ctx->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), bgBrush.GetAddressOf());\n"
              "                ctx->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::Black), textBrush.GetAddressOf());\n"
              "                if (!bgBrush || !textBrush) continue;\n"
              "                ctx->FillRectangle(it.slot, bgBrush.Get());\n"
          )
          if old not in text:
              raise SystemExit('Expected legacy sampled-background block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'axing1218-source'
          git config user.email 'axing1218@gmail.com'
          git add Src/StarCapOcrV2.h
          git commit -m 'Unify OCR translated image background' || exit 0
          git push origin HEAD:main
