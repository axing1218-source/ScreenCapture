name: Apply Capture UX V4

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/apply-capture-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Apply capture UX V4
        run: python .github/scripts/apply_capture_v4.py

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'class MagnifierPopup : public Ling::WinBase' Src/Win/CutMask.cpp
          grep -q 'crossThickness = 6.3f' Src/Win/CutMask.cpp
          grep -q 'mi.rcWork' Src/Win/CutMask.cpp
          grep -q 'cutMask->syncMagnifier(pos);' Src/Win/WinCap.cpp

      - name: Commit patched source and remove temporary patch files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/apply_capture_v4.py .github/workflows/apply-capture-v4.yml
          git add -A
          git commit -m 'Refine capture magnifier and help overlay'
          git push origin HEAD:feature/snipaste-capture-ux
