name: Apply Magnifier Reference Cell Fix

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/apply-magnifier-reference-cell-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Patch magnifier center cell
        shell: python
        run: |
          from pathlib import Path
          path = Path('Src/Win/CutMask.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    const float cx = left + centerCol * cellW;\n    const float cy = top + centerRow * cellH;\n    const float crossThickness = 6.3f * scale;\n    const float crossHalf = crossThickness * .5f;\n    const float cellCenterX = cx + cellW * .5f;\n    const float cellCenterY = cy + cellH * .5f;\n    ctx->FillRectangle(D2D1::RectF(left, cellCenterY - crossHalf, left + panelW, cellCenterY + crossHalf), brushAccentSoft.Get());\n    ctx->FillRectangle(D2D1::RectF(cellCenterX - crossHalf, top, cellCenterX + crossHalf, top + imageH), brushAccentSoft.Get());\n\n    // The black frame must coincide exactly with the blue square formed by the\n    // cross intersection. Build the frame from four filled bars instead of\n    // DrawRectangle so every side has the exact same thickness and no side\n    // receives different stroke rasterization.\n    const float outlineThickness = std::max(.9f, 1.35f * scale);\n    const float squareL = cellCenterX - crossHalf;\n    const float squareT = cellCenterY - crossHalf;\n    const float squareR = cellCenterX + crossHalf;\n    const float squareB = cellCenterY + crossHalf;\n    ctx->FillRectangle(D2D1::RectF(squareL, squareT, squareR, squareT + outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareL, squareB - outlineThickness, squareR, squareB), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareL, squareT + outlineThickness, squareL + outlineThickness, squareB - outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(squareR - outlineThickness, squareT + outlineThickness, squareR, squareB - outlineThickness), brushCenterBorder.Get());\n    ctx->SetAntialiasMode(oldAA);\n'''
          new = '''    const float cx = left + centerCol * cellW;\n    const float cy = top + centerRow * cellH;\n    const float crossThickness = 6.3f * scale;\n    const float crossHalf = crossThickness * .5f;\n    const float cellCenterX = cx + cellW * .5f;\n    const float cellCenterY = cy + cellH * .5f;\n\n    // Match the Snipaste reference: the center target is one complete magnified\n    // source pixel cell. The blue cross stops at that cell instead of painting\n    // through it, so the current pixel remains visible inside the frame.\n    const float frameL = std::round(cx);\n    const float frameT = std::round(cy);\n    const float frameR = std::round(cx + cellW);\n    const float frameB = std::round(cy + cellH);\n    ctx->FillRectangle(D2D1::RectF(left, cellCenterY - crossHalf, frameL, cellCenterY + crossHalf), brushAccentSoft.Get());\n    ctx->FillRectangle(D2D1::RectF(frameR, cellCenterY - crossHalf, left + panelW, cellCenterY + crossHalf), brushAccentSoft.Get());\n    ctx->FillRectangle(D2D1::RectF(cellCenterX - crossHalf, top, cellCenterX + crossHalf, frameT), brushAccentSoft.Get());\n    ctx->FillRectangle(D2D1::RectF(cellCenterX - crossHalf, frameB, cellCenterX + crossHalf, top + imageH), brushAccentSoft.Get());\n\n    // Pure black, one physical pixel, hard edged. Four filled bars avoid the\n    // asymmetric rasterization that DrawRectangle can produce at fractional\n    // coordinates. The border sits at the outside of the center target cell.\n    const float outlineThickness = 1.f;\n    ctx->FillRectangle(D2D1::RectF(frameL, frameT, frameR, frameT + outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(frameL, frameB - outlineThickness, frameR, frameB), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(frameL, frameT + outlineThickness, frameL + outlineThickness, frameB - outlineThickness), brushCenterBorder.Get());\n    ctx->FillRectangle(D2D1::RectF(frameR - outlineThickness, frameT + outlineThickness, frameR, frameB - outlineThickness), brushCenterBorder.Get());\n    ctx->SetAntialiasMode(oldAA);\n'''
          if old not in text:
              raise SystemExit('Expected magnifier center block not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Match magnifier center cell to reference"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build updated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/apply-magnifier-reference-cell-fix.yml
          git commit -m "Remove temporary magnifier reference patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
