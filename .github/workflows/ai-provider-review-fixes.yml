name: StarCap AI Provider Review Fixes

on:
  push:
    branches:
      - starcap-v0.9.8-ai-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Harden AI provider model compatibility'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: starcap-v0.9.8-ai-providers

      - name: Apply reviewed compatibility fixes
        run: python tools/patch_ai_provider_review.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'claude-fable-5-1' Src/AIClient.h
          grep -q 'supportedGenerationMethods' Src/AIClient.h
          grep -q 'thinkingLevel.*low' Src/GeminiClient.h || grep -q 'CreateStringValue(L"low")' Src/GeminiClient.h
          if grep -q 'temporarily incomplete; append account-visible' Src/AIClient.h; then exit 1; fi
          git diff --stat

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axing1218-source'
          git config user.email 'axing1218@gmail.com'
          git add Src/AIClient.h Src/GeminiClient.h
          git commit -m 'Harden AI provider model compatibility'
          git push origin HEAD:starcap-v0.9.8-ai-providers
