name: WeShot Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - weshot-v0.1
      - weshot-v0.8.1-fix

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ScreenCapture fork
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare Ling dependency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --depth 1 https://github.com/xland/Ling.git D:\project\Ling
          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare portable GIF build
        shell: pwsh
        run: |
          $gif = Get-Content Src\Win\VideoGif.hpp -Raw
          $gif = $gif.Replace('#include "gifski.h"', '')
          $gif = [regex]::Replace($gif, '(?s)\s*//这段代码是好的.*?inline void createGif2\(GifParam\* param\) \{', "`r`n    inline void createGif2(GifParam* param) {")
          Set-Content Src\Win\VideoGif.hpp $gif -Encoding utf8
          $video = Get-Content Src\Win\CapVideo.cpp -Raw
          $video = $video.Replace('VideoGif::createGif(gifParam.get());', 'VideoGif::createGif2(gifParam.get());')
          Set-Content Src\Win\CapVideo.cpp $video -Encoding utf8
          $proj = Get-Content Src\ScreenCapture.vcxproj -Raw
          $proj = $proj.Replace('D:\sdk\gifski;', '')
          $proj = $proj.Replace(';D:\sdk\gifski\target\release\gifski.lib', '')
          Set-Content Src\ScreenCapture.vcxproj $proj -Encoding utf8

      - name: Patch Gemini connectivity and latency diagnostics
        shell: pwsh
        run: |
          $gemini = Get-Content Src\GeminiClient.h -Raw

          # Keep gemini-3.7-flash, but use its officially supported low thinking level for OCR/translation.
          $gemini = $gemini.Replace('model.find(L"flash") != std::wstring::npos ? L"minimal" : L"low"', 'L"low"')

          # Prefer the current user's explicit Windows proxy if present; otherwise use WinHTTP automatic proxy.
          $oldLines = @(
            '        HINTERNET session = WinHttpOpen(L"WeShot/0.8", WINHTTP_ACCESS_TYPE_AUTOMATIC_PROXY,',
            '            WINHTTP_NO_PROXY_NAME, WINHTTP_NO_PROXY_BYPASS, 0);',
            '        if (!session) { result.error = L"无法初始化网络连接。"; return result; }'
          )
          $old = $oldLines -join "`r`n"
          if (-not $gemini.Contains($old)) { $old = $oldLines -join "`n" }
          $newLines = @(
            '        WINHTTP_CURRENT_USER_IE_PROXY_CONFIG userProxy{};',
            '        const BOOL hasUserProxyConfig = WinHttpGetIEProxyConfigForCurrentUser(&userProxy);',
            '        const bool hasNamedProxy = hasUserProxyConfig && userProxy.lpszProxy && userProxy.lpszProxy[0];',
            '        const DWORD accessType = hasNamedProxy ? WINHTTP_ACCESS_TYPE_NAMED_PROXY : WINHTTP_ACCESS_TYPE_AUTOMATIC_PROXY;',
            '        LPCWSTR proxyName = hasNamedProxy ? userProxy.lpszProxy : WINHTTP_NO_PROXY_NAME;',
            '        LPCWSTR proxyBypass = (hasNamedProxy && userProxy.lpszProxyBypass) ? userProxy.lpszProxyBypass : WINHTTP_NO_PROXY_BYPASS;',
            '        HINTERNET session = WinHttpOpen(L"WeShot/0.8.3", accessType, proxyName, proxyBypass, 0);',
            '        if (userProxy.lpszAutoConfigUrl) GlobalFree(userProxy.lpszAutoConfigUrl);',
            '        if (userProxy.lpszProxy) GlobalFree(userProxy.lpszProxy);',
            '        if (userProxy.lpszProxyBypass) GlobalFree(userProxy.lpszProxyBypass);',
            '        if (!session) { result.error = L"无法初始化网络连接。"; return result; }'
          )
          $new = $newLines -join "`r`n"
          if (-not $gemini.Contains($old)) { throw 'Could not locate WinHTTP session block.' }
          $gemini = $gemini.Replace($old, $new)

          # v0.7 allowed 120 s. v0.8 accidentally reduced receive timeout to 25 s, and v0.8.2 to 20 s.
          # Restore a sane ceiling for real inference while reporting the exact failing stage.
          $gemini = $gemini.Replace('WinHttpSetTimeouts(session, 8000, 8000, 15000, 25000);', 'WinHttpSetTimeouts(session, 7000, 7000, 15000, 60000);')

          $oldSend = @'
        BOOL sent = WinHttpSendRequest(request, WINHTTP_NO_ADDITIONAL_HEADERS, 0,
            body.empty() ? WINHTTP_NO_REQUEST_DATA : body.data(), (DWORD)body.size(), (DWORD)body.size(), 0);
        if (sent) sent = WinHttpReceiveResponse(request, nullptr);
        if (!sent) {
            result.error = std::format(L"Gemini 网络请求失败（Windows 错误 {}）。", GetLastError());
        }
        else {
'@
          $newSend = @'
        const ULONGLONG sendStart = GetTickCount64();
        BOOL sent = WinHttpSendRequest(request, WINHTTP_NO_ADDITIONAL_HEADERS, 0,
            body.empty() ? WINHTTP_NO_REQUEST_DATA : body.data(), (DWORD)body.size(), (DWORD)body.size(), 0);
        if (!sent) {
            const DWORD err = GetLastError();
            result.error = std::format(L"Gemini 发送请求失败（Windows 错误 {}，{} ms）。", err, GetTickCount64() - sendStart);
        }
        BOOL received = FALSE;
        ULONGLONG receiveStart = 0;
        if (sent) {
            receiveStart = GetTickCount64();
            received = WinHttpReceiveResponse(request, nullptr);
            if (!received) {
                const DWORD err = GetLastError();
                result.error = std::format(L"等待 Gemini 响应失败（Windows 错误 {}，{} ms）。", err, GetTickCount64() - receiveStart);
            }
        }
        if (sent && received) {
'@
          if (-not $gemini.Contains($oldSend)) {
            $oldSend = $oldSend -replace "`r`n", "`n"
            $newSend = $newSend -replace "`r`n", "`n"
          }
          if (-not $gemini.Contains($oldSend)) { throw 'Could not locate Gemini send/receive block.' }
          $gemini = $gemini.Replace($oldSend, $newSend)

          # Medium image resolution gives desktop text enough detail without the cost of high-resolution vision.
          $needle = '        generation.SetNamedValue(L"maxOutputTokens", JsonValue::CreateNumberValue(maxOutputTokens));'
          $media = '        generation.SetNamedValue(L"mediaResolution", JsonValue::CreateStringValue(L"MEDIA_RESOLUTION_MEDIUM"));'
          if ($gemini.Contains($needle) -and -not $gemini.Contains('L"mediaResolution"')) {
            $gemini = $gemini.Replace($needle, $needle + "`r`n" + $media)
          }

          # A connection test must not run inference. Use the official models.get metadata endpoint instead.
          $testFunction = @'
    inline TestResult testConnection(const std::wstring& apiKey, const std::wstring& model)
    {
        TestResult out;
        if (apiKey.empty()) { out.message = L"Gemini API Key 为空。"; return out; }
        const auto modelId = model.empty() ? std::wstring(L"gemini-3.7-flash") : model;
        const ULONGLONG started = GetTickCount64();

        WINHTTP_CURRENT_USER_IE_PROXY_CONFIG userProxy{};
        const BOOL hasUserProxyConfig = WinHttpGetIEProxyConfigForCurrentUser(&userProxy);
        const bool hasNamedProxy = hasUserProxyConfig && userProxy.lpszProxy && userProxy.lpszProxy[0];
        const DWORD accessType = hasNamedProxy ? WINHTTP_ACCESS_TYPE_NAMED_PROXY : WINHTTP_ACCESS_TYPE_AUTOMATIC_PROXY;
        LPCWSTR proxyName = hasNamedProxy ? userProxy.lpszProxy : WINHTTP_NO_PROXY_NAME;
        LPCWSTR proxyBypass = (hasNamedProxy && userProxy.lpszProxyBypass) ? userProxy.lpszProxyBypass : WINHTTP_NO_PROXY_BYPASS;
        HINTERNET session = WinHttpOpen(L"WeShot/0.8.3-Test", accessType, proxyName, proxyBypass, 0);
        if (userProxy.lpszAutoConfigUrl) GlobalFree(userProxy.lpszAutoConfigUrl);
        if (userProxy.lpszProxy) GlobalFree(userProxy.lpszProxy);
        if (userProxy.lpszProxyBypass) GlobalFree(userProxy.lpszProxyBypass);
        if (!session) { out.message = L"测试连接：无法初始化网络。"; return out; }
        WinHttpSetTimeouts(session, 7000, 7000, 10000, 15000);

        HINTERNET connect = WinHttpConnect(session, L"generativelanguage.googleapis.com", INTERNET_DEFAULT_HTTPS_PORT, 0);
        if (!connect) { WinHttpCloseHandle(session); out.message = L"测试连接：无法创建 Google API 连接。"; return out; }
        std::wstring path = L"/v1beta/models/" + modelId;
        HINTERNET request = WinHttpOpenRequest(connect, L"GET", path.c_str(), nullptr,
            WINHTTP_NO_REFERER, WINHTTP_DEFAULT_ACCEPT_TYPES, WINHTTP_FLAG_SECURE);
        if (!request) { WinHttpCloseHandle(connect); WinHttpCloseHandle(session); out.message = L"测试连接：无法创建请求。"; return out; }
        std::wstring headers = L"x-goog-api-key: " + apiKey + L"\r\n";
        WinHttpAddRequestHeaders(request, headers.c_str(), (DWORD)-1L,
            WINHTTP_ADDREQ_FLAG_ADD | WINHTTP_ADDREQ_FLAG_REPLACE);

        const ULONGLONG sendAt = GetTickCount64();
        if (!WinHttpSendRequest(request, WINHTTP_NO_ADDITIONAL_HEADERS, 0,
            WINHTTP_NO_REQUEST_DATA, 0, 0, 0)) {
            const DWORD err = GetLastError();
            out.message = std::format(L"测试连接：发送失败（Windows 错误 {}，{} ms）。", err, GetTickCount64() - sendAt);
            WinHttpCloseHandle(request); WinHttpCloseHandle(connect); WinHttpCloseHandle(session); return out;
        }
        const ULONGLONG receiveAt = GetTickCount64();
        if (!WinHttpReceiveResponse(request, nullptr)) {
            const DWORD err = GetLastError();
            out.message = std::format(L"测试连接：等待响应失败（Windows 错误 {}，{} ms）。", err, GetTickCount64() - receiveAt);
            WinHttpCloseHandle(request); WinHttpCloseHandle(connect); WinHttpCloseHandle(session); return out;
        }

        DWORD statusCode = 0, statusSize = sizeof(statusCode);
        WinHttpQueryHeaders(request, WINHTTP_QUERY_STATUS_CODE | WINHTTP_QUERY_FLAG_NUMBER,
            WINHTTP_HEADER_NAME_BY_INDEX, &statusCode, &statusSize, WINHTTP_NO_HEADER_INDEX);
        std::string response;
        for (;;) {
            DWORD available = 0;
            if (!WinHttpQueryDataAvailable(request, &available) || available == 0) break;
            const size_t oldSize = response.size(); response.resize(oldSize + available);
            DWORD read = 0;
            if (!WinHttpReadData(request, response.data() + oldSize, available, &read)) { response.resize(oldSize); break; }
            response.resize(oldSize + read);
        }
        WinHttpCloseHandle(request); WinHttpCloseHandle(connect); WinHttpCloseHandle(session);

        if (statusCode < 200 || statusCode >= 300) {
            out.message = std::format(L"测试连接失败（HTTP {}）：{}", statusCode, getApiError(response)); return out;
        }
        out.ok = true;
        out.message = std::format(L"连接成功 · {} · {} ms", modelId, GetTickCount64() - started);
        return out;
    }
'@
          $pattern = '(?s)    inline TestResult testConnection\(const std::wstring& apiKey, const std::wstring& model\).*?\r?\n    \}\r?\n\r?\n    inline OcrResult recognizeImage'
          $replacement = $testFunction + "`r`n    inline OcrResult recognizeImage"
          $patched = [regex]::Replace($gemini, $pattern, $replacement, 1)
          if ($patched -eq $gemini) { throw 'Could not replace Gemini connection test.' }
          $gemini = $patched

          Set-Content Src\GeminiClient.h $gemini -Encoding utf8
          $verified = Get-Content Src\GeminiClient.h -Raw
          if (-not $verified.Contains('L"/v1beta/models/" + modelId')) { throw 'models.get connection test missing.' }
          if (-not $verified.Contains('等待 Gemini 响应失败')) { throw 'stage diagnostics missing.' }
          if (-not $verified.Contains('L"low"')) { throw 'low thinking patch missing.' }
          if (-not $verified.Contains('L"mediaResolution"')) { throw 'media resolution patch missing.' }

      - name: Build ScreenCapture
        shell: pwsh
        run: |
          msbuild Src\ScreenCapture.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find executable
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter ScreenCapture.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'ScreenCapture.exe was not produced.' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe.FullName artifact\ScreenCapture.exe
          Write-Host "Built: $($exe.FullName)"

      - name: Upload WeShot test executable
        uses: actions/upload-artifact@v4
        with:
          name: WeShot-Windows-x64
          path: artifact/ScreenCapture.exe
          if-no-files-found: error
