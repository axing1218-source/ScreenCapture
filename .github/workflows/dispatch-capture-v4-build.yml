name: Dispatch Capture V4 Build

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/dispatch-capture-v4-build.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Dispatch direct source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux --repo axing1218-source/StarCap

      - name: Remove temporary dispatcher
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/dispatch-capture-v4-build.yml
          git add -A
          git commit -m 'Remove temporary capture V4 build dispatcher'
          git push origin HEAD:feature/snipaste-capture-ux
