name: Fix StarCap AI Scroll and Timeout

on:
  push:
    branches:
      - starcap-v0.9.8-ai-providers

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Gemini timeout and scrollable model selector'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: starcap-v0.9.8-ai-providers

      - name: Apply fixes
        run: python tools/fix_ai_scroll_and_gemini_timeout.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'receiveTimeoutMs = 45000' Src/GeminiClient.h
          grep -q '90000' Src/GeminiClient.h
          grep -q 'getScrollY()' Src/Win/WinSettingCommon.cpp
          grep -q 'isPosInContent(pos)' Src/Win/WinSettingCommon.cpp
          grep -q 'selectValues' Src/Win/WinSettingCommon.h
          if grep -q '__next_page__\|__prev_page__\|aiModelPage' Src/Win/WinSettingCommon.cpp Src/Win/WinSettingCommon.h; then exit 1; fi
          git diff --stat

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axing1218-source'
          git config user.email 'axing1218@gmail.com'
          git add Src/GeminiClient.h Src/Win/WinSettingCommon.h Src/Win/WinSettingCommon.cpp
          git commit -m 'Fix Gemini timeout and scrollable model selector'
          git push origin HEAD:starcap-v0.9.8-ai-providers
