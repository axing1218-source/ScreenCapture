name: Finalize StarCap v0.9.8 Preview

on:
  push:
    branches:
      - starcap-v0.9.8-ai-providers

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize StarCap v0.9.8 preview source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: starcap-v0.9.8-ai-providers

      - name: Finalize v0.9.8 source
        run: python tools/finalize_v098_preview.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'StarCap/0.9.8' Src/GeminiClient.h
          grep -q 'StarCap/0.9.8' Src/AIClient.h
          if grep -q 'StarCap/0.9.7' Src/GeminiClient.h Src/AIClient.h; then exit 1; fi
          grep -q 'STARCAP_DISPLAY_VERSION L"v0.9.8"' Src/Version.h

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'axing1218-source'
          git config user.email 'axing1218@gmail.com'
          git add Src/GeminiClient.h Src/AIClient.h
          git commit -m 'Finalize StarCap v0.9.8 preview source'
          git push origin HEAD:starcap-v0.9.8-ai-providers
